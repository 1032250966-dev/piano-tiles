  <rect x="184" y="110" width="64" height="170" rx="12" fill="url(#magentaGlow)" filter="url(#glow)"/>
  <rect x="272" y="190" width="64" height="140" rx="12" fill="#8b5cf6" filter="url(#glow)"/>
  <rect x="360" y="130" width="64" height="160" rx="12" fill="#ffe600" filter="url(#glow)"/>
  <circle cx="128" cy="110" r="6" fill="#00f3ff"/>
  <circle cx="216" cy="70" r="5" fill="#ff007f"/>
  <circle cx="304" cy="140" r="6" fill="#8b5cf6"/>
  <circle cx="392" cy="90" r="4" fill="#ffe600"/>
