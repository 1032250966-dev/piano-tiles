  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <path d="M 64 360 Q 256 420 448 360" stroke="#00f3ff" stroke-width="4" fill="none" opacity="0.6" filter="url(#glow)"/>
